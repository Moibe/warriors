  <rect x="1" y="1" width="14" height="14" rx="2" fill="none" stroke="#4e8ae2" stroke-width="1" />
  <rect x="7" y="2" width="2" height="7" fill="#e6edf7" />
  <rect x="7" y="2" width="1" height="7" fill="#a8bad2" />
  <rect x="4" y="9" width="8" height="1" fill="#ffd24a" />
  <rect x="5" y="10" width="6" height="1" fill="#d9a93a" />
  <rect x="7" y="10" width="2" height="3" fill="#7b4f2c" />
  <rect x="6" y="13" width="4" height="1" fill="#ffd24a" />
</svg>
